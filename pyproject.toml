[project]
name = "review-agent"
version = "0.1.0"
description = "A code review agent: three read-only reviewers in parallel, merged into one report."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.161",
    "pydantic>=2.9",
]

[project.scripts]
review-agent = "review_agent.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
